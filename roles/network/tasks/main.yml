---
- name: Install required packages
  ansible.builtin.dnf:
    name: "{{ network_packages }}"
    state: present

- name: Enable FRR daemons
  ansible.builtin.lineinfile:
    path: /etc/frr/daemons
    regexp: '^{{ item }}='
    line: '{{ item }}=yes'
  loop:
    - bgpd
    - zebra
    - bfdd
  notify:
    - restart frr

- name: Deploy frr conf for managed nodes
  ansible.builtin.template:
    src: "{{ inventory_hostname_short }}.frr.conf"
    dest: /etc/frr/frr.conf
  ignore_errors: true
  notify:
    - restart frr

- name: Ensure service frr is enabled and started
  ansible.builtin.systemd_service:
    name: frr
    state: started
    enabled: true

- name: Configure loopback interface
  community.general.nmcli:
    conn_name: lo
    conn_reload: true
    ip4:
      - "127.0.0.1/8"
      - "{{ loopback }}"
    state: present
  when: loopback is defined

- name: Configure bridge devices for virtual machines
  community.general.nmcli:
    autoconnect: true
    method4: "{{ item['method4'] | default('disabled') }}"
    method6: "{{ item['method6'] | default('disabled') }}"
    autoconnect_priority: 999
    conn_name: "br-{{ item['name'] }}"
    conn_reload: true
    ifname: "br-{{ item['name'] }}"
    ip4: "{{ item['ip4'] | default(omit) }}"
    state: "{{ item['state'] | default('present') }}"
    stp: false
    type: bridge
  loop: "{{ network_bridges }}"
  when: network_bridges | length > 0


- ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: true
    state: present
    reload: true

- name: restart frr
  ansible.builtin.systemd_service:
    name: frr
    state: restarted
  tags:
    - never
    - frr.restart

