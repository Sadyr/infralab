---
- name: Install pip
  dnf:
    name: pip
    state: present
  when: "'lb' in inventory_hostname or 'str' in inventory_hostname"

- name: Install flask
  shell: pip install flask
  when: "'lb' in inventory_hostname or 'str' in inventory_hostname"

- name: Deploy test script python
  template:
    src: test.py.j2
    dest: /usr/local/sbin/teststr
    mode: "0755"
    owner: root
    group: root
  when: "'lb' in inventory_hostname or 'str' in inventory_hostname"

