! /etc/frr/frr.conf
hostname border01.webcloud.kz
log syslog informational

router bgp 65024
 bgp router-id 172.16.0.24
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax

 neighbor SPINES peer-group
 neighbor SPINES remote-as external
 neighbor SPINES bfd
 neighbor 10.0.0.52 peer-group SPINES
 neighbor 10.0.0.54 peer-group SPINES

 address-family ipv4 unicast
  network 172.16.0.24/32
  neighbor SPINES activate
  maximum-paths 64
 exit-address-family


 address-family l2vpn evpn
  neighbor SPINES activate
  advertise-all-vni      
 exit-address-family

 vrf vrf_lb
 vni 400
 exit-vrf

router bgp 65024 vrf vrf_lb
 address-family ipv4 unicast
  label vpn export auto
  rd vpn export 172.16.0.24:400
  rt vpn both 65000:1000
  import vpn
  export vpn
  
  default-information originate
 exit-address-family

 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
