! /etc/frr/frr.conf
hostname lb03.webcloud.kz
log syslog informational

router bgp 65033
 bgp router-id 172.16.0.33
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax

! Сосед - твой Leaf03
 neighbor LEAF peer-group
 neighbor LEAF remote-as external
 neighbor LEAF bfd
 neighbor 10.0.0.26 peer-group LEAF
 neighbor 10.0.0.42 peer-group LEAF


 address-family ipv4 unicast
  network 172.16.0.33/32
  neighbor LEAF activate
  maximum-paths 64
 exit-address-family

 address-family l2vpn evpn
  neighbor LEAF activate
  advertise-all-vni
  advertise-svi-ip
 exit-address-family
