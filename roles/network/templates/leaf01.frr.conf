! /etc/frr/frr.conf
hostname leaf01.webcloud.kz
log syslog informational

router bgp 65021
 bgp router-id 172.16.0.21
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax

 ! Аплинки к Spine
 neighbor SPINES peer-group
 neighbor SPINES remote-as external
 neighbor SPINES bfd
 neighbor 10.0.0.12 peer-group SPINES
 neighbor 10.0.0.32 peer-group SPINES


 ! Даунлинки к LB
 neighbor LBS peer-group
 neighbor LBS remote-as external
 neighbor LBS bfd
 neighbor 10.0.0.23 peer-group LBS
 neighbor 10.0.0.43 peer-group LBS

 address-family ipv4 unicast
  network 172.16.0.21/32
  neighbor SPINES activate
  neighbor LBS activate
  maximum-paths 64
 exit-address-family


 address-family l2vpn evpn
  neighbor SPINES activate
  neighbor LBS activate
  advertise-all-vni      
 exit-address-family
