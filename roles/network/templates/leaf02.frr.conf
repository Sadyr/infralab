! /etc/frr/frr.conf
hostname leaf02.webcloud.kz
log syslog informational

router bgp 65022
 bgp router-id 172.16.0.22
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax

 neighbor SPINES peer-group
 neighbor SPINES remote-as external
 neighbor SPINES bfd
 neighbor 10.0.0.14 peer-group SPINES
 neighbor 10.0.0.34 peer-group SPINES


 neighbor LBS peer-group
 neighbor LBS remote-as external
 neighbor LBS bfd
 neighbor 10.0.0.25 peer-group LBS
 neighbor 10.0.0.45 peer-group LBS

 address-family ipv4 unicast
  network 172.16.0.22/32
  neighbor SPINES activate
  neighbor LBS activate
  maximum-paths 64
 exit-address-family

 address-family l2vpn evpn
  neighbor LBS activate
  neighbor SPINES activate
  advertise-all-vni
 exit-address-family
